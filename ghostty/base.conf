# Base condivisa di Ghostty: tutte le impostazioni indipendenti dal tema.
# Non viene letta direttamente: bin/theme genera active/ghostty.conf
# concatenando questo file con themes/<tema>/ghostty.conf.

# Caratteri
font-family = JetBrainsMono Nerd Font
font-size = 14
font-feature = liga
font-feature = calt
font-feature = ss01
font-feature = ss02
font-feature = ss03

# Stile del cursore (i colori sono nel tema)
cursor-style = bar
cursor-style-blink = true
cursor-opacity = 0.9
adjust-cursor-thickness = 2
cursor-click-to-move = true

# Padding interno della finestra
window-padding-x = 12
window-padding-y = 12

# Estetica
background-opacity = 0.95
background-blur = 15
unfocused-split-opacity = 0.85

# Spaziatura migliorata
adjust-cell-width = 1
adjust-cell-height = 8%
adjust-font-baseline = 1

# Integrazioni macOS
macos-option-as-alt = right
macos-titlebar-proxy-icon = visible
macos-window-shadow = true
macos-titlebar-style = transparent

# Configurazione clipboard
clipboard-trim-trailing-spaces = true

# Mappatura dei caratteri per simboli speciali
font-codepoint-map = U+2500-U+259F=Symbols Nerd Font Mono

# Feedback visivo
resize-overlay = always
resize-overlay-position = bottom-right
mouse-hide-while-typing = true

# Shell integration
shell-integration = detect
shell-integration-features = cursor,title
