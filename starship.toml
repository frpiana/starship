# ~/.config/starship.toml
# Configurazione principale Starship

# Inserts a blank line between shell prompts
add_newline = true

# Timeout per le scansioni e i comandi
scan_timeout = 50
command_timeout = 500

# Configurazione aggiuntiva non specifica del tema
follow_symlinks = true

# I moduli seguenti sono gestiti direttamente nel tema tokyo-night.toml
# Qui puoi aggiungere configurazioni globali aggiuntive o override

# Configura la shell di editing per i prompt di comando
[shell]
disabled = false
