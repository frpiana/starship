# Tabby Matcha Latte — tema tmux (versione diurna)
set -g status-style bg="#e5d8c3",fg="#3a2c21"
set -g status-left "#[fg=#f7efe3,bg=#b06e2e,bold] #S "
set -g status-right "#[fg=#f7efe3,bg=#b06e2e,bold] #H "

# Finestre
setw -g window-status-current-style fg="#f7efe3",bg="#b06e2e",bold
setw -g window-status-current-format " #I:#W "
setw -g window-status-style fg="#3a2c21",bg="#e5d8c3"
setw -g window-status-format " #I:#W "

# Bordi pannelli
set -g pane-border-style fg="#c9b8a5"
set -g pane-active-border-style fg="#b06e2e"

# Messaggi
set -g message-style bg="#b06e2e",fg="#f7efe3"
