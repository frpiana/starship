# Tabby Matcha — colori Ghostty
# Base caffè tostato, testo crema, caramello tabby, matcha e sakura.

window-theme = dark

# Colori principali
background = #221a15
foreground = #f2e5d5

# Colori per il cursore (sakura)
cursor-color = #e8a3b8
cursor-text = #221a15

# Colori per la selezione
selection-background = #57443f
selection-foreground = #f2e5d5
selection-invert-fg-bg = false

