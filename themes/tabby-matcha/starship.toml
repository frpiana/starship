# === Impostazioni globali (Starship legge un solo file: vivono qui in testa) ===
add_newline = true
scan_timeout = 50
command_timeout = 5000
follow_symlinks = true

# Prompt sequence setting — pantone Tabby Matcha
# latte #e3d5c1 → caramello #e8a15d → caffè #57443f → #453629 → #33281f
format = """
[░▒▓](#e3d5c1)\
[  ](fg:#15100d bg:#e3d5c1)\
[](fg:#e3d5c1 bg:#e8a15d)\
$directory\
[](fg:#e8a15d bg:#57443f)\
$git_branch\
$git_status\
[](fg:#57443f bg:#453629)\
$nodejs\
$rust\
$golang\
$php\
$python\
$rlang\
$haskell\
$lua\
$c\
$cmake\
[](fg:#453629 bg:#33281f)\
$time\
[ ](fg:#33281f)\
\n$character"""

# Second layer
[directory]
style = "fg:#15100d bg:#e8a15d"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

# third layer — branch in sakura come nel pantone
[git_branch]
symbol = ""
style = "bg:#57443f"
format = '[[ $symbol $branch ](fg:#e8a3b8 bg:#57443f)]($style)'

[git_status]
style = "bg:#57443f"
format = '[[($all_status$ahead_behind )](fg:#e8a3b8 bg:#57443f)]($style)'

# Forth layer
[nodejs]
symbol = ""
style = "bg:#453629"
format = '[[ $symbol ($version) ](fg:#d6c6b2 bg:#453629)]($style)'

[rust]
symbol = ""
style = "bg:#453629"
format = '[[ $symbol ($version) ](fg:#d6c6b2 bg:#453629)]($style)'

[golang]
symbol = ""
style = "bg:#453629"
format = '[[ $symbol ($version) ](fg:#d6c6b2 bg:#453629)]($style)'

[php]
symbol = ""
style = "bg:#453629"
format = '[[ $symbol ($version) ](fg:#d6c6b2 bg:#453629)]($style)'

[lua]
symbol = "🌙"
style = "bg:#453629"
format = '[[ $symbol ($version) ](fg:#d6c6b2 bg:#453629)]($style)'
detect_extensions = ["lua"]

[python]
symbol = "🐍"
style = "bg:#453629"
format = '[[ $symbol ($version) ($virtualenv) ](fg:#d6c6b2 bg:#453629)]($style)'
detect_extensions = ["py"]
python_binary = ["python3"]

[haskell]
symbol = "" # icona haskell (nerd font)
style = "bg:#453629"
format = '[[ $symbol ($version) ](fg:#d6c6b2 bg:#453629)]($style)'
detect_extensions = ["hs", "lhs"]
detect_files = ["stack.yaml", "cabal.project"]
disabled = false

[c]
symbol = ""
style = "bg:#453629"
format = '[[ $symbol ($version) ](fg:#d6c6b2 bg:#453629)]($style)'
detect_extensions = ["c", "h", "cpp", "cc", "cxx", "hpp", "hh", "hxx"]

[rlang]
symbol = "📐"
style = "bg:#453629"
format = '[[ $symbol ($version) ](fg:#d6c6b2 bg:#453629)]($style)'
detect_extensions = ["R", "Rd", "Rmd", "Rproj", "Rsx"]

[cmake]
symbol = ""
style = "bg:#453629"
format = '[[ $symbol ](fg:#d6c6b2 bg:#453629)]($style)'
detect_files = ["CMakeLists.txt"]

# Fifth layer
[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#33281f"
format = '[[  $time ](fg:#c9b8a5 bg:#33281f)]($style)'

# Abilita il modulo shell (non presente nel format -> resta invisibile)
[shell]
disabled = false
